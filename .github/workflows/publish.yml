name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check the Host entry
        run: node --check index.js

      - name: Register every tool against a stub context
        run: npm test

      - name: Verify the packed tarball
        run: npm run verify

  publish:
    name: Publish ${{ github.ref_name }} to npmjs.com
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # npm has two ways to authenticate here. Trusted publishing exchanges the
      # GitHub OIDC token (id-token: write, below) once the npm package lists
      # this repository as a trusted publisher; the repository's NPM_TOKEN
      # secret covers the window before that setting exists.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$version. Bump the version, commit, and tag again."
            exit 1
          fi
          echo "Publishing $version from tag ${GITHUB_REF_NAME}"

      - name: Publish with provenance (trusted publishing)
        id: oidc
        continue-on-error: true
        run: npm publish --provenance --access public

      # ENEEDAUTH names the one fixable cause: no trusted publisher answers for
      # this repository yet. Authenticate with the profile token instead, which
      # is the same account, and let --provenance attest the build through the
      # job's OIDC token.
      - name: Publish with provenance (npm token fallback)
        if: steps.oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Trusted publishing failed and NPM_TOKEN is unset; add the trusted publisher on npmjs.com or set the repository secret."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --provenance --access public

      - name: Summarize
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Published ${GITHUB_REF_NAME}"
            echo ""
            echo "- Package: dsh-plugin-discourse@$version"
            echo "- npm: https://www.npmjs.com/package/dsh-plugin-discourse/v/$version"
            echo "- Provenance: attached to the npm version page (build transparency log)"
            echo "- Install: dsh plugin --profile desktop add dsh-plugin-discourse@$version"
          } >> "$GITHUB_STEP_SUMMARY"
